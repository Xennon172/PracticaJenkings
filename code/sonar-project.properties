# ──────────────────────────────────────────────────────────────
#  sonar-project.properties
#  Configuración del proyecto para el escáner de SonarQube
#  Debe estar en la raíz del repositorio (junto a package.json)
# ──────────────────────────────────────────────────────────────

# Identificador único del proyecto en SonarQube (sin espacios)
sonar.projectKey=jenkins-tests

# Nombre visible en el dashboard de SonarQube
sonar.projectName=Jenkins Tests - Practica

# Versión (se puede leer desde package.json si se prefiere)
sonar.projectVersion=1.0.1

# Directorio raíz de los fuentes a analizar
sonar.sources=.

# Excluir carpetas que no deben analizarse
sonar.exclusions=node_modules/**,test-results/**

# Directorio de los tests
sonar.tests=test

# Encoding del código fuente
sonar.sourceEncoding=UTF-8

# Lenguaje principal
sonar.language=js

# ── Cobertura (opcional, activar si se añade nyc/istanbul) ─────
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
